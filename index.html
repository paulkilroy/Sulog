<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a2e34" />
<title>Sulog has moved</title>
<link rel="canonical" href="https://sulog-two.vercel.app/" />
<!-- Sulog lives at a new home now. Send everyone there. -->
<meta http-equiv="refresh" content="2; url=https://sulog-two.vercel.app/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a2e34'/><path d='M8 60 C28 48 40 70 58 60 C72 52 84 66 92 60 L92 96 L8 96 Z' fill='%2316a3ab'/><circle cx='74' cy='30' r='12' fill='%23f4a53a'/></svg>" />
<style>
  :root { --paper:#f7f1e6; --ink:#0a2e34; --jade:#16a3ab; --gold:#f4a53a; --soft:#5d6b6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, #fffaf0 0%, var(--paper) 55%);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px; text-align: center;
  }
  .card { max-width: 30rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mark { width: 76px; height: 76px; margin-bottom: 14px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 1.9rem; margin: 0; letter-spacing: .01em; }
  .lead { color: var(--soft); font-size: 1.02rem; margin: 6px 0 22px; text-wrap: balance; }
  .go {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--jade); color: #fff; text-decoration: none; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; font-size: 1rem;
    box-shadow: 0 6px 18px rgba(22,163,171,.28); transition: transform .12s ease, box-shadow .12s ease;
  }
  .go:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(22,163,171,.34); }
  .go:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .go .arrow { transition: transform .12s ease; }
  .go:hover .arrow { transform: translateX(3px); }
  .note { color: var(--soft); font-size: .82rem; margin-top: 20px; }
  .note code { background: #eae2d1; padding: 1px 6px; border-radius: 5px; font-size: .82em; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0c2226; --ink:#eaf3f2; --soft:#93a3a3; }
    body { background: radial-gradient(120% 90% at 50% -10%, #123236 0%, var(--paper) 55%); }
    .note code { background: #17383c; }
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#0a2e34" />
      <path d="M8 60 C28 48 40 70 58 60 C72 52 84 66 92 60 L92 96 L8 96 Z" fill="#16a3ab" />
      <circle cx="74" cy="30" r="12" fill="#f4a53a" />
    </svg>
    <h1>Sulog has a new home</h1>
    <p class="lead">Taking you there now. If nothing happens, tap below.</p>
    <a class="go" href="https://sulog-two.vercel.app/">Open Sulog <span class="arrow" aria-hidden="true">&rarr;</span></a>
    <p class="note">New address: <code>sulog-two.vercel.app</code> — update your bookmark.</p>
  </main>
  <script>
    // Belt-and-suspenders: send anyone whose browser ignores the meta refresh.
    setTimeout(function () { location.replace("https://sulog-two.vercel.app/"); }, 400);
  </script>
</body>
</html>
